# Optional: local Prometheus (+ Grafana) for visualizing the crawler's
# /metrics endpoint while it runs on the host.
#   docker compose -f monitoring/docker-compose.yml up
# Then: Prometheus UI at :9091, Grafana at :3000 (login admin/admin),
# add Prometheus (http://prometheus:9090) as a Grafana data source.
version: "3.8"
services:
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
